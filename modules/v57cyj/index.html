<footer class="modulex-srt{{srtsinif}}" role="contentinfo">
  {{srtserit}}
  <div class="modulex-srt-govde">
    <a class="modulex-srt-logo" href="/{{lang}}/" aria-label="@home@ - {{web-name}}">
      <img src="/img/{{logo}}" alt="{{web-name}}" loading="lazy" decoding="async" />
    </a>
    {{srthakkinda}}
    <nav aria-label="@navigation@">
      <ul class="modulex-srt-satir modulex-srt-sayfa">{{srtsayfa}}</ul>
    </nav>
    {{srtiletisim}}
    {{srtsosyal}}
  </div>
  <div class="modulex-srt-alt">
    <p class="modulex-srt-telif">&copy; {{srtyil}} {{web-name}} — @all-rights@</p>
    <div class="modulex-srt-dil">{{langbar}}</div>
  </div>
</footer>

<style>
  /* footer-serit — ortalı tek sütun + yazı şeridi (15 Kas 2026, G3). Üstte vurgu renkli şerit: büyük başlık fontunda dolu/çizgili
     sıralı kelimeler; KENDİLİĞİNDEN AKMAZ, sayfa kaydırıldıkça kayar (WCAG 2.2.2 — duraklatma gerektiren otomatik hareket yok).
     Altında her şey ortalı: logo · kısa metin · «/» ayraçlı sayfa satırı · iletişim satırı · sosyal · ince çizgi + telif + dil.
     Renkler yalnız desing anahtarından (var(--mx-site-*) varsayılanlı); mantıksal CSS; şerit yönü RTL'de ters. */
  .modulex-srt {
    box-sizing: border-box;
    width: 100%;
    overflow: hidden;
    background: --bg--;
    color: --text--;
    font-family: var(--mx-font-sans, inherit);
    text-align: center;
  }
  .modulex-srt *,
  .modulex-srt *::before,
  .modulex-srt *::after { box-sizing: border-box; }

  .modulex-srt-serit {
    padding-block: 18px;
    background: --seritBg--;
    color: --seritText--;
    transform: rotate(--egim--);
    margin-block: 28px 8px;
    margin-inline: -20px;
    white-space: nowrap;
    overflow: hidden;
  }
  .modulex-srt-akis {
    display: inline-flex;
    align-items: center;
    gap: 28px;
    padding-inline-start: 28px;
    will-change: transform;
    transform: translateX(var(--srt-x, 0px));
    transition: transform 0.2s linear;
  }
  .modulex-srt-kelime {
    font-family: var(--mx-font-heading, inherit);
    font-size: clamp(1.8rem, 5vw, 3.6rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.1;
    text-transform: uppercase;
  }
  .modulex-srt-kelime--cizgi {
    color: transparent;
    -webkit-text-stroke: 1.5px --seritText--;
  }
  html[lang="ar"] .modulex-srt-kelime,
  html[lang="fa"] .modulex-srt-kelime,
  html[lang="ur"] .modulex-srt-kelime,
  html[lang="he"] .modulex-srt-kelime { letter-spacing: 0; text-transform: none; }
  .modulex-srt-yildiz { font-size: 1.4rem; opacity: 0.8; }

  .modulex-srt-govde {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    max-width: --max--;
    margin-inline: auto;
    padding: 48px 20px 32px;
  }
  .modulex-srt--seritsiz .modulex-srt-govde { padding-block-start: 56px; }
  .modulex-srt-logo { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; }
  .modulex-srt-logo img {
    display: block;
    height: auto;
    width: auto;
    max-height: --logo_h--;
    max-width: 220px;
    object-fit: contain;
    flex-shrink: 0;
  }
  .modulex-srt-logo img[src*=".svg"] { height: --logo_h--; width: auto; max-width: none; }
  .modulex-srt-hakkinda { margin: 0; max-width: 56ch; color: --muted--; line-height: 1.65; }

  .modulex-srt-satir {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 0;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .modulex-srt-satir li { display: inline-flex; align-items: center; }
  .modulex-srt-satir li + li::before {
    content: "/";
    padding-inline: 10px;
    color: --line--;
  }
  .modulex-srt-iletisim li + li::before { content: "·"; }
  .modulex-srt-adres { color: --muted--; padding-block: 10px; }
  .modulex-srt .modulex-srt-link {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding-inline: 4px;
    color: --text--;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
    transition: color 0.25s ease, transform 0.25s ease;
  }
  .modulex-srt-sayfa .modulex-srt-link { font-size: 1.05rem; }
  .modulex-srt .modulex-srt-link:hover,
  .modulex-srt .modulex-srt-link:focus-visible,
  .modulex-srt .modulex-srt-link[aria-current="page"] { color: --accent--; }
  .modulex-srt .modulex-srt-link:hover { transform: translateY(-2px); }
  .modulex-srt .modulex-srt-link:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }

  .modulex-srt-sosyal { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 4px 0 0; padding: 0; list-style: none; }
  .modulex-srt .modulex-srt-sosyal-a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: color-mix(in srgb, --text-- 7%, transparent);
    color: --text--;
    font-size: 19px;
    cursor: pointer;
    transition: transform 0.3s ease, background-color 0.3s ease, color 0.3s ease;
  }
  .modulex-srt .modulex-srt-sosyal-a:hover,
  .modulex-srt .modulex-srt-sosyal-a:focus-visible { transform: rotate(-8deg) scale(1.08); background: --accent--; color: --accentText--; }

  .modulex-srt-alt {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    max-width: --max--;
    margin-inline: auto;
    padding: 18px 20px 26px;
    border-block-start: 1px solid --line--;
  }
  .modulex-srt-telif { margin: 0; color: --muted--; font-size: 0.85rem; }
  .modulex-srt-dil { display: flex; justify-content: center; color: --text--; }

  @media (max-width: 1024px) {
    .modulex-srt-govde { padding-block: 40px 28px; }
  }
  @media (max-width: 768px) {
    .modulex-srt-serit { padding-block: 12px; margin-block-start: 20px; }
    .modulex-srt-satir li + li::before { padding-inline: 6px; }
    .modulex-srt-sayfa .modulex-srt-link { font-size: 1rem; }
    .modulex-srt-iletisim { flex-direction: column; }
    .modulex-srt-iletisim li + li::before { content: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-srt * { transition: none !important; animation: none !important; }
    .modulex-srt-akis { transform: none !important; }
  }
</style>

<script>
  (() => {
    const kok = document.querySelector(".modulex-srt");
    if (!kok || kok.dataset.srtHazir) return;
    kok.dataset.srtHazir = "1";
    const akis = kok.querySelector(".modulex-srt-akis");
    if (!akis || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    /* kaydırmaya bağlı kayma: şerit ekrana girdiği andan çıktığı ana kadar en çok bir kopya boyu kayar; RTL'de ters yön */
    const rtl = document.documentElement.getAttribute("dir") === "rtl";
    let bekliyor = false;
    const uygula = () => {
      bekliyor = false;
      const r = kok.getBoundingClientRect();
      const vh = window.innerHeight || 1;
      const ilerleme = Math.min(1, Math.max(0, (vh - r.top) / (vh + r.height)));
      const yol = akis.scrollWidth / (Number(akis.dataset.kopya) || 3);
      akis.style.setProperty("--srt-x", `${((rtl ? 1 : -1) * ilerleme * yol).toFixed(1)}px`);
    };
    const gozcu = new IntersectionObserver((g) => {
      if (g[0]?.isIntersecting) window.addEventListener("scroll", tetik, { passive: true });
      else window.removeEventListener("scroll", tetik);
    });
    function tetik() {
      if (bekliyor) return;
      bekliyor = true;
      requestAnimationFrame(uygula);
    }
    gozcu.observe(kok);
    uygula();
  })();
</script>
